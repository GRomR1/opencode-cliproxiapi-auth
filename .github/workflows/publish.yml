name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ($TAG) does not match package.json ($PKG)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check version is not already on npm
        run: |
          PKG="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view opencode-cliproxyapi-auth version 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$PKG" ]; then
            echo "Version $PKG is already published on npm — bump package.json first"
            exit 1
          fi
          echo "Will publish $PKG (latest on npm: ${PUBLISHED:-none})"

      - name: Publish package (OIDC trusted publisher)
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          npm publish --access public --loglevel verbose
